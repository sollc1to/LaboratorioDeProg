<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Estadísticas del Servidor</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/Stylers/stylers.css" />
    <link rel="stylesheet" href="/Stylers/stylersestadistica.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>

</head>

<body>

    <nav-bar id="navegador"></nav-bar>

    <div id="error-ssh-container"
        style="background-color: #e2e3e5; color: #383d41; padding: 25px; margin: 30px auto; max-width: 600px; border-radius: 8px; border: 1px solid #d6d8db; text-align: center; font-family: 'Montserrat', sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h3 style="margin-top: 0; font-size: 1.2rem;">Panel de Control SSH</h3>

        <p id="error-ssh-mensaje" style="margin: 15px 0; font-size: 0.95rem;">
            Estableciendo conexión con el servidor remoto a través de SSH... Por favor, espera.
        </p>

        <button id="btn-reintentar-ssh"
            style="background-color: #721c24; color: white; border: none; padding: 10px 22px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; display: none; transition: background 0.2s;">
            🔄 Intentar de nuevo
        </button>
    </div>

    <ul class="accordion" id="metricas-charts-container" style="display: none;">
        <li>
            <label for="Usage_CPU%" style="width:100%; min-width:600px;">CPU</label>
            <div class="content_metricas">
                <div id="CpuChart"></div>
            </div>
        </li>

        <li>
            <label for="Usage_RAM">RAM</label>
            <div class="content_metricas">
                <div id="RamChart"></div>
            </div>
        </li>

        <li>
            <label for="Usage_Disk">Disco</label>
            <div class="content_metricas">
                <div id="DiskChart"></div>
            </div>
        </li>

        <li>
            <label for="Cpu_temp">Temperatura CPU</label>
            <div class="content_metricas">
                <div id="TempChart"></div>
            </div>
        </li>
    </ul>

    <!-- Botón para mostrar/ocultar terminal -->
    <button id="toggle-terminal"
        style="position: fixed; bottom: 20px; right: 20px; background: #000; color: #0f0; border: 1px solid #0f0; border-radius: 5px; padding: 8px 15px; font-family: monospace; cursor: pointer; z-index: 1000;">💻
        Terminal</button>

    <div id="matrix-terminal"
        style="display: none; position: fixed; bottom: 80px; right: 20px; width: 650px; max-width: 80vw; height: 450px; background: #000; border: 2px solid #0f0; border-radius: 8px; box-shadow: 0 0 20px #0f0; font-family: 'Courier New', monospace; z-index: 1000; flex-direction: column; overflow: hidden;">
        <div id="terminal-header"
            style="background: #0f0; color: #000; padding: 6px 12px; font-weight: bold; cursor: move; user-select: none;">
            Terminal SSH </div>
        <div id="terminal-output"
            style="flex: 1; padding: 10px; overflow-y: scroll; color: #0f0; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; scrollbar-width: none; -ms-overflow-style: none;">
        </div>
        <div style="display: flex; padding: 8px; border-top: 1px solid #0f0;">
            <span style="color: #0f0; margin-right: 8px;">$</span>
            <input type="text" id="terminal-input"
                style="flex: 1; background: #000; border: none; color: #0f0; outline: none; font-family: monospace; font-size: 13px;"
                autocomplete="off">
        </div>
    </div>

    <footer id="footer"></footer>

    <script src="/Scripts/navBar.js"></script>
    <script src="/Scripts/footer.js"></script>

    <script src="/Scripts/script.js"></script>
    <script type="module" src="/Scripts/metricas.js"></script>

</body>

</html>
